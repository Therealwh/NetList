name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository boundaries
        run: python -m scripts.netlist_data check-structure
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build catalog
        run: python -m scripts.netlist_data build
      - name: Guard against data loss
        run: python -m scripts.netlist_data guards
      - name: Verify generated structure and whitespace
        run: |
          python -m scripts.netlist_data check-structure
          git diff --check
