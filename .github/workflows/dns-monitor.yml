name: dns-monitor

on:
  # Run after catalog generation, independently from the longer list/logo build.
  workflow_run:
    workflows: ["update-lists"]
    types: [completed]
    branches: [main]
  # Daily fallback after the normal 03:00 UTC data build.
  schedule:
    - cron: "30 4 * * *"
  # Also publish a baseline when the monitor implementation is first added or changed.
  push:
    branches: [main]
    paths:
      - "scripts/netlist_data/dns_monitor.py"
      - "tests/test_dns_monitor.py"
      - ".github/workflows/dns-monitor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dns-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run per-domain A/AAAA monitoring
        run: python -m scripts.netlist_data.dns_monitor

      - name: Publish only the DNS monitoring snapshot
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          git config user.name "netlist-bot"
          git config user.email "actions@users.noreply.github.com"
          SNAPSHOT="$(mktemp)"
          cp state/dns_monitor.json "$SNAPSHOT"

          # The catalog workflow and other monitor runs may update main while DNS
          # queries are running. Rebase the generated snapshot onto the latest
          # main on every attempt; never force-push or overwrite unrelated commits.
          for attempt in 1 2 3 4 5; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            cp "$SNAPSHOT" state/dns_monitor.json
            git add -- state/dns_monitor.json
            if git diff --cached --quiet; then
              echo "DNS monitoring snapshot is unchanged"
              exit 0
            fi
            git diff --cached --check
            git commit -m "update DNS monitoring snapshot [skip ci]"
            if git push origin HEAD:main; then
              echo "DNS snapshot published on attempt $attempt"
              exit 0
            fi
            echo "main moved during push; retrying against latest origin/main ($attempt/5)"
          done
          echo "Could not publish DNS snapshot after 5 attempts" >&2
          exit 1
